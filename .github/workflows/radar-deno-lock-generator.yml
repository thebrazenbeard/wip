name: radar-deno-lock-generator

on:
  push:
    branches:
      - "radar/deno-lock-generator-v1-20260906"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.6
      - name: Generate and verify Radar Edge dependency lock
        working-directory: radar-deno-lock
        run: |
          set -euo pipefail
          rm -f deno.lock
          deno install --entrypoint deps.ts --frozen=false
          deno ci
          deno check deps.ts
      - name: Upload verified lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: radar-deno-lock
          path: radar-deno-lock/deno.lock
          if-no-files-found: error
