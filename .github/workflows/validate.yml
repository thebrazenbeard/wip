name: validate-wip

on:
  push:
    branches:
      - main
      - work/wip-hardening-v1-20260904
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository validation
        run: python tools/wip.py validate .
